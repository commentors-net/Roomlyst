name: roomlyst

services:
  roomlyst-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: roomlyst-api:v0.9.0
    container_name: roomlyst-api
    restart: unless-stopped
    ports:
      - "${ROOMLYST_PORT:-8081}:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:////app/storage/roomlyst.db
      - SECRET_KEY=change-this-to-a-secure-random-secret-key-in-production
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_PATH=storage
      - OLLAMA_BASE_URL=http://192.168.0.200:11434
      - DEFAULT_OLLAMA_MODEL=llama3.2:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - roomlyst_data:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - roomlyst_net
      - lan_gateway_net

networks:
  roomlyst_net:
    name: roomlyst_net
    driver: bridge
  lan_gateway_net:
    name: lan_gateway_net
    external: true

volumes:
  roomlyst_data:
    name: roomlyst_roomlyst_data
