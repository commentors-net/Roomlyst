# Shared LAN Multi-Application Gateway Nginx Configuration
# Listens on port 8080 on 192.168.0.200 private LAN.
# Blueprint Section 17 & Prompt 10 Specification.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Shared LAN Reverse Proxy Gateway
    server {
        listen 8080;
        server_name _;

        # Client body size for room photo uploads
        client_max_body_size 35M;

        # ----------------------------------------------------------------------
        # Roomlyst AI Interior Platform Subpath Route
        # ----------------------------------------------------------------------
        location = /roomlyst {
            return 301 /roomlyst/;
        }

        location /roomlyst/ {
            proxy_pass http://roomlyst-api:8000/;
            proxy_http_version 1.1;

            # Header preservation
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /roomlyst;

            # WebSocket and streaming upgrade support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Extended timeouts for AI processing jobs
            proxy_connect_timeout 30s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;

            # Buffering configuration
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # ----------------------------------------------------------------------
        # Shared Gateway Landing Page & Route Directory
        # ----------------------------------------------------------------------
        location = / {
            default_type text/html;
            return 200 '<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LAN Multi-App Staging Gateway</title>
  <style>
    body { background: #0b0f19; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #141c2e; border: 1px solid #22314e; border-radius: 12px; padding: 32px; max-width: 540px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    h1 { font-size: 1.4rem; margin-bottom: 8px; color: #38bdf8; }
    p { font-size: 0.85rem; color: #94a3b8; line-height: 1.5; margin-bottom: 20px; }
    .route-item { display: flex; align-items: center; justify-content: space-between; background: #0f172a; padding: 12px 16px; border-radius: 8px; border: 1px solid #22314e; margin-bottom: 10px; text-decoration: none; color: inherit; transition: border-color 0.2s; }
    .route-item:hover { border-color: #3b82f6; }
    .badge { background: rgba(16, 185, 129, 0.2); color: #34d399; font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; font-weight: 700; }
    .badge-future { background: rgba(148, 163, 184, 0.15); color: #94a3b8; }
    .footer { font-size: 0.75rem; color: #64748b; margin-top: 20px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>LAN Staging Gateway (Port 8080)</h1>
    <p>Host: 192.168.0.200 &middot; Isolated application staging and test routing.</p>
    <a href="/roomlyst/" class="route-item">
      <div>
        <div style="font-weight: 600;">Roomlyst Studio</div>
        <div style="font-size: 0.75rem; color: #94a3b8;">AI Interior Design &amp; Renovation Platform</div>
      </div>
      <span class="badge">ACTIVE</span>
    </a>
    <div class="route-item" style="opacity: 0.6; cursor: not-allowed;">
      <div>
        <div style="font-weight: 600;">NutriLens</div>
        <div style="font-size: 0.75rem; color: #94a3b8;">Multi-App Slot Template (/nutrilens/)</div>
      </div>
      <span class="badge badge-future">PLANNED</span>
    </div>
    <div class="footer">Secure LAN Reverse Proxy &middot; Prompt 10 Multi-Application Architecture</div>
  </div>
</body>
</html>';
        }

        # ----------------------------------------------------------------------
        # Strict Default Deny for unmapped paths
        # ----------------------------------------------------------------------
        location / {
            default_type application/json;
            return 404 '{"error": "NOT_FOUND", "message": "No application registered at this path on the LAN gateway.", "gateway": "192.168.0.200:8080"}';
        }
    }

    # Map for WebSocket Connection header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
}
